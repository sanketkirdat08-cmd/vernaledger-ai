<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Live Barcode Gun Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0e17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .scanner-container {
      position: relative;
      width: 100%;
      height: 380px;
      background: #070a10;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .top-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(10, 14, 23, 0.85) 0%, rgba(10, 14, 23, 0) 100%);
      z-index: 10;
      pointer-events: auto;
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      background: #00ff87;
      border-radius: 50%;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    .pill-dot.paused {
      background: #ffb800;
      animation: none;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 8px #00ff87; }
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(0, 242, 254, 0.3);
    }
    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78%;
      max-width: 320px;
      height: 180px;
      border: 2px solid rgba(0, 242, 254, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .viewfinder::before, .viewfinder::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #00ff87;
      border-style: solid;
      pointer-events: none;
    }
    .viewfinder::before {
      top: 0; left: 0;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 10px;
    }
    .viewfinder::after {
      bottom: 0; right: 0;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 10px;
    }
    .laser-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ff334b;
      box-shadow: 0 0 12px #ff334b, 0 0 4px #fff;
      animation: scanLaser 1.8s ease-in-out infinite alternate;
      z-index: 6;
    }
    @keyframes scanLaser {
      0% { top: 8%; opacity: 0.9; }
      50% { opacity: 1; }
      100% { top: 92%; opacity: 0.9; }
    }
    .viewfinder.success {
      border-color: #00ff87 !important;
      box-shadow: 0 0 24px rgba(0, 255, 135, 0.9), 0 0 0 2000px rgba(0, 0, 0, 0.45) !important;
    }
    .viewfinder.success .laser-line {
      background: #00ff87 !important;
      box-shadow: 0 0 16px #00ff87, 0 0 6px #fff !important;
      animation: none !important;
      top: 50% !important;
    }
    .bottom-bar {
      padding: 10px 14px;
      text-align: center;
      background: linear-gradient(0deg, rgba(10, 14, 23, 0.92) 0%, rgba(10, 14, 23, 0) 100%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .status-text.detected {
      color: #00ff87;
      font-size: 14px;
      font-weight: 800;
    }
    .btn-resume {
      display: none;
      background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
      color: #000;
      border: 0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 255, 135, 0.4);
      pointer-events: auto;
    }
    .btn-resume:active {
      transform: scale(0.95);
    }
    .err-view {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: rgba(10, 14, 23, 0.95);
      z-index: 20;
    }
    .err-msg {
      color: #ffb800;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .retry-btn {
      background: #00f2fe;
      color: #000;
      border: 0;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
  <script src="./zxing.min.js"></script>
</head>
<body>
  <div class="scanner-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay">
      <div class="top-bar">
        <div class="pill-badge">
          <div class="pill-dot" id="pill-dot"></div>
          <span id="pill-title">DMart Live Gun</span>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="btn-torch" title="Flash/Light">🔦</button>
          <button class="ctrl-btn" id="btn-flip" title="Switch Camera">🔄</button>
        </div>
      </div>

      <div class="viewfinder" id="viewfinder">
        <div class="laser-line" id="laser"></div>
      </div>

      <div class="bottom-bar">
        <div class="status-text" id="status-text">बारकोड लाल रेषेच्या बरोबर मध्यभागी धरा...</div>
        <button class="btn-resume" id="btn-resume">🔄 पुढील वस्तू स्कॅन करा (Scan Next)</button>
      </div>
    </div>

    <div class="err-view" id="err-view">
      <div style="font-size: 28px; margin-bottom: 8px;">📷</div>
      <div class="err-msg" id="err-msg">कॅमेरा सुरू होत आहे...</div>
      <button class="retry-btn" id="btn-retry">पुन्हा प्रयत्न करा</button>
    </div>
  </div>

  <script>
    // Audio Beep Generator using Web Audio API
    let audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.14);
      } catch (e) {
        console.warn("Audio beep failed:", e);
      }
      try {
        if (navigator.vibrate) navigator.vibrate(100);
      } catch (e) {}
    }

    const video = document.getElementById("video");
    const viewfinder = document.getElementById("viewfinder");
    const statusText = document.getElementById("status-text");
    const btnResume = document.getElementById("btn-resume");
    const pillDot = document.getElementById("pill-dot");
    const pillTitle = document.getElementById("pill-title");
    const errView = document.getElementById("err-view");
    const errMsg = document.getElementById("err-msg");
    const btnRetry = document.getElementById("btn-retry");
    const btnFlip = document.getElementById("btn-flip");
    const btnTorch = document.getElementById("btn-torch");

    let currentStream = null;
    let currentTrack = null;
    let facingMode = "environment";
    let isTorchOn = false;
    let isScanning = true;
    let activeScannedBarcode = "";
    let codeReader = null;
    let hasBarcodeDetector = ("BarcodeDetector" in window);
    let nativeDetector = null;
    let scanLoopId = null;

    if (hasBarcodeDetector) {
      try {
        nativeDetector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code']
        });
      } catch (e) {
        nativeDetector = null;
      }
    }

    function sendToStreamlit(data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function notifyStreamlitReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 388
      }, "*");
    }

    function handleDetected(rawCode, format) {
      if (!isScanning) return;
      const cleanCode = String(rawCode).trim();
      if (!cleanCode) return;

      // 1. STOP SCANNING IMMEDIATELY to prevent rerun loops!
      isScanning = false;
      activeScannedBarcode = cleanCode;

      if (scanLoopId) {
        cancelAnimationFrame(scanLoopId);
        scanLoopId = null;
      }
      if (codeReader && codeReader.reset) {
        try { codeReader.reset(); } catch(e) {}
      }

      // 2. Play supermarket beep & vibration
      playBeep();

      // 3. UI Confirmation
      viewfinder.classList.add("success");
      pillDot.classList.add("paused");
      pillTitle.textContent = "स्कॅन पूर्ण (Paused)";
      statusText.classList.add("detected");
      statusText.textContent = `✅ बारकोड: ${cleanCode}`;
      btnResume.style.display = "inline-block";

      // 4. Send to Streamlit ONCE
      sendToStreamlit({
        barcode: cleanCode,
        format: format || "EAN"
      });
    }

    function resumeScanning() {
      if (isScanning) return;
      isScanning = true;
      activeScannedBarcode = "";
      viewfinder.classList.remove("success");
      pillDot.classList.remove("paused");
      pillTitle.textContent = "DMart Live Gun";
      statusText.classList.remove("detected");
      statusText.textContent = "बारकोड लाल रेषेच्या बरोबर मध्यभागी धरा...";
      btnResume.style.display = "none";
      startScannerEngines();
    }

    btnResume.addEventListener("click", () => {
      resumeScanning();
      sendToStreamlit({ barcode: "", action: "resume" });
    });

    async function startCamera() {
      errView.style.display = "none";
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      if (scanLoopId) {
        cancelAnimationFrame(scanLoopId);
        scanLoopId = null;
      }

      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        currentTrack = stream.getVideoTracks()[0];
        video.srcObject = stream;
        await video.play();

        const capabilities = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
        if (capabilities.torch) {
          btnTorch.style.display = "flex";
        } else {
          btnTorch.style.display = "none";
        }

        if (isScanning) {
          startScannerEngines();
        }
      } catch (err) {
        console.error("Camera error:", err);
        errView.style.display = "flex";
        errMsg.textContent = "कॅमेरा सुरू करता आला नाही. कृपया ब्राउझरमध्ये Camera Permission द्या (Allow Camera).";
      }
    }

    function startScannerEngines() {
      if (!isScanning) return;

      // Engine 1: Native GPU BarcodeDetector (fastest, ~10ms in Android Chrome)
      if (nativeDetector) {
        async function runNativeLoop() {
          if (!isScanning) return;
          try {
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
              const barcodes = await nativeDetector.detect(video);
              if (barcodes && barcodes.length > 0) {
                const b = barcodes[0];
                if (b.rawValue) {
                  handleDetected(b.rawValue, b.format);
                  return;
                }
              }
            }
          } catch (e) {}
          if (isScanning) {
            scanLoopId = requestAnimationFrame(runNativeLoop);
          }
        }
        scanLoopId = requestAnimationFrame(runNativeLoop);
        return;
      }

      // Engine 2: ZXing-JS Fallback
      if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
        try {
          if (!codeReader) {
            codeReader = new ZXing.BrowserMultiFormatReader();
          }
          codeReader.decodeFromVideoElement(video, (result, err) => {
            if (!isScanning) return;
            if (result && result.text) {
              handleDetected(result.text, result.format ? result.format.toString() : "EAN");
            }
          });
        } catch (e) {
          console.warn("ZXing fallback error:", e);
        }
      }
    }

    btnRetry.addEventListener("click", () => {
      startCamera();
    });

    btnFlip.addEventListener("click", () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      startCamera();
    });

    btnTorch.addEventListener("click", async () => {
      if (currentTrack && currentTrack.applyConstraints) {
        try {
          isTorchOn = !isTorchOn;
          await currentTrack.applyConstraints({
            advanced: [{ torch: isTorchOn }]
          });
          btnTorch.style.background = isTorchOn ? "rgba(0, 242, 254, 0.5)" : "rgba(255, 255, 255, 0.12)";
        } catch (e) {
          console.warn("Torch toggle failed:", e);
        }
      }
    });

    // Handle messages from Streamlit
    window.addEventListener("message", (event) => {
      if (!event.data || !event.data.isStreamlitMessage) return;
      if (event.data.type === "streamlit:render") {
        const args = (event.data.args) || {};
        // If Streamlit cleared active_barcode_search, resume scanning!
        if (args.active_barcode === "") {
          resumeScanning();
        } else if (args.active_barcode) {
          // Keep paused on current barcode
          isScanning = false;
        }
      }
    });

    // Initialize
    window.addEventListener("DOMContentLoaded", () => {
      notifyStreamlitReady();
      startCamera();
    });
  </script>
</body>
</html>
