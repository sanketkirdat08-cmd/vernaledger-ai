<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#050b16"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#040a18" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>
  
  <!-- Outer Shield Glow -->
  <path d="M256 82 L396 142 V246 C396 342 328 412 256 442 C184 412 116 342 116 246 V142 Z" 
        fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="15" stroke-linejoin="round"/>

  <!-- Digital Dotted Ledger Line -->
  <path d="M158 250 H354" stroke="#00f2fe" stroke-width="12" stroke-dasharray="18 14" stroke-linecap="round" opacity="0.85"/>

  <!-- Verna 'V' Core Ledger Wings -->
  <path d="M182 188 L256 332 L330 188" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Ledger Node Dots -->
  <!-- Left Upper Node -->
  <circle cx="182" cy="188" r="16" fill="#ffffff" stroke="#00f2fe" stroke-width="5"/>
  <!-- Right Upper Node -->
  <circle cx="330" cy="188" r="16" fill="#ffffff" stroke="#00f2fe" stroke-width="5"/>
  <!-- Apex Smart AI Node (Emerald Green) -->
  <circle cx="256" cy="332" r="22" fill="#00ff87" stroke="#ffffff" stroke-width="7"/>
  <circle cx="256" cy="332" r="32" fill="none" stroke="#00ff87" stroke-width="3" opacity="0.5"/>
</svg>