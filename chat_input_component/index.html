<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
    }

    .chat-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 68px;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(103, 232, 249, 0.24);
      border-radius: 50px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.48), 0 0 24px rgba(34, 211, 238, 0.12);
      backdrop-filter: blur(18px);
    }

    button {
      display: inline-flex;
      flex: 0 0 46px;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-button {
      color: #b9c3d6;
      background: transparent;
      border-radius: 50%;
      transition: color 160ms ease, background 160ms ease;
    }

    .mic-button:hover,
    .mic-button[aria-pressed="true"] {
      color: #67e8f9;
      background: rgba(103, 232, 249, 0.1);
    }

    .mic-button[aria-pressed="true"] {
      animation: pulse 1.4s ease-in-out infinite;
    }

    .message-input {
      flex: 1 1 auto;
      min-width: 0;
      height: 46px;
      padding: 0 2px;
      color: #f4f6fb;
      background: transparent;
      border: 0;
      outline: 0;
      box-shadow: none;
      font: inherit;
      font-size: 16px;
    }

    .message-input::placeholder {
      color: #929bad;
      opacity: 1;
    }

    .send-button {
      color: #101522;
      background: #8be9f2;
      border-radius: 50%;
      transition: background 160ms ease, transform 160ms ease;
    }

    .send-button:hover {
      background: #b5f5fa;
      transform: translateY(-1px);
    }

    .send-button:active {
      transform: scale(0.95);
    }

    button:focus-visible,
    .message-input:focus-visible {
      outline: 2px solid #8be9f2;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 5px rgba(103, 232, 249, 0.12);
      }
    }

    @media (max-width: 600px) {
      .chat-bar {
        height: 60px;
        gap: 4px;
        padding: 6px 7px;
      }

      button {
        flex-basis: 42px;
        width: 42px;
        height: 42px;
      }

      .message-input {
        height: 42px;
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="chat-bar" role="group" aria-label="Chat message">
    <button class="mic-button" id="mic-button" type="button" aria-label="Speak your message" aria-pressed="false" title="Speak your message">
      <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"></path>
      </svg>
    </button>
    <input
      class="message-input"
      id="message-input"
      type="text"
      placeholder="Ask in English, मराठी, or हिंदी..."
      aria-label="Ask in English, Marathi, or Hindi"
      autocomplete="off"
    >
    <button class="send-button" id="send-button" type="button" aria-label="Send message" title="Send message">
      <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </button>
    <span class="sr-only" id="mic-status" aria-live="polite"></span>
  </div>
  <script>
    const input = document.getElementById("message-input");
    const micButton = document.getElementById("mic-button");
    const sendButton = document.getElementById("send-button");
    const micStatus = document.getElementById("mic-status");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function sendToStreamlit(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value
      }, "*");
    }

    function submitMessage() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      sendToStreamlit({
        id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        kind: "submit",
        text
      });
      input.value = "";
      input.focus();
    }

    sendButton.addEventListener("click", submitMessage);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        submitMessage();
      }
    });

    micButton.addEventListener("click", () => {
      if (!SpeechRecognition) {
        micStatus.textContent = "Speech recognition is not supported in this browser.";
        micButton.title = micStatus.textContent;
        return;
      }

      if (recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.interimResults = false;
      recognition.continuous = false;
      micButton.setAttribute("aria-pressed", "true");
      micStatus.textContent = "Listening";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          sendToStreamlit({
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            kind: "voice",
            text: transcript
          });
        }
      };

      recognition.onerror = (event) => {
        micStatus.textContent = event.error === "not-allowed"
          ? "Microphone access was denied."
          : `Speech recognition error: ${event.error}`;
        micButton.title = micStatus.textContent;
      };

      recognition.onend = () => {
        recognition = null;
        micButton.setAttribute("aria-pressed", "false");
        if (micStatus.textContent === "Listening") {
          micStatus.textContent = "";
        }
      };

      try {
        recognition.start();
      } catch (error) {
        recognition = null;
        micButton.setAttribute("aria-pressed", "false");
        micStatus.textContent = "Unable to start speech recognition.";
        micButton.title = micStatus.textContent;
      }
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 76
    }, "*");
  </script>
</body>
</html>
